# atlas.mycomap.org, behind Cloudflare (proxied, SSL mode Full (strict)).
# Installed by setup-box.sh as /etc/nginx/sites-available/atlas.

# The visitor's own address, from Cloudflare: rate limits are per visitor.
include /etc/nginx/snippets/cloudflare-real-ip.conf;

server {
    listen 80;
    listen [::]:80;
    server_name atlas.mycomap.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name atlas.mycomap.org;

    # A Cloudflare origin certificate: Cloudflare is the only client.
    ssl_certificate     /etc/ssl/atlas/origin.pem;
    ssl_certificate_key /etc/ssl/atlas/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The web app, copied out of the release image by deploy.sh.
    root /srv/atlas/web;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The API and sign-in, to the API on loopback. Never the app's fallback
    # page, never an intercepted error: an API answer is always the API's.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/snippets/atlas-proxy.conf;
    }
    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/snippets/atlas-proxy.conf;
    }

    # Built assets carry a content hash in their names.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Everything else is the single-page app.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
