# atlas.mycomap.org, behind Cloudflare (proxied, SSL mode Full (strict)).
# Installed by setup-box.sh as /etc/nginx/sites-available/atlas.

# The visitor's own address, from Cloudflare: rate limits are per visitor.
include /etc/nginx/snippets/cloudflare-real-ip.conf;

# The API's public answers, kept for as long as the API's own Cache-Control
# allows. The API is one R process answering one request at a time; on a
# launch day a hundred visitors opening the Maps page must not mean a hundred
# trips to R. Answers marked private or no-store (sign-in, rasters), answers
# that set a cookie, and errors are never kept.
proxy_cache_path /var/cache/nginx/atlas levels=1:2 keys_zone=atlas_api:10m
                 max_size=512m inactive=60m use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name atlas.mycomap.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name atlas.mycomap.org;

    # A Cloudflare origin certificate: Cloudflare is the only client.
    ssl_certificate     /etc/ssl/atlas/origin.pem;
    ssl_certificate_key /etc/ssl/atlas/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The web app, copied out of the release image by deploy.sh.
    root /srv/atlas/web;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The API and sign-in, to the API on loopback. Never the app's fallback
    # page, never an intercepted error: an API answer is always the API's.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/snippets/atlas-proxy.conf;

        proxy_cache atlas_api;
        proxy_cache_key $scheme$host$request_uri;
        # A token holder's answers carry their own tier and limits: never
        # served from, or stored in, the shared cache.
        proxy_cache_bypass $http_authorization;
        proxy_no_cache $http_authorization;
        # Many visitors asking for the same thing at once wait for one answer,
        # and a stale answer is served while a fresh one is fetched.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_use_stale updating;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;
    }
    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/snippets/atlas-proxy.conf;
    }

    # Built assets carry a content hash in their names.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The app's own pages, by first path segment (web/src/App.tsx; CI checks
    # the two agree). They are the single-page app.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location ~ ^/(maps|here|models|taxa|data|layers|methods|sources|developers|privacy|about)(/|$) {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Files in the app's root (robots.txt, the logo), and otherwise a real 404:
    # the app's page, which shows "not found", with a 404 status, so a search
    # engine does not index every mistyped address as a page.
    location / {
        try_files $uri =404;
        error_page 404 /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
