version: 2

updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Actions are pinned by commit SHA in the workflows, so this is how they get
  # updated at all.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The Dockerfile pins its base image by digest; this proposes new digests.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
