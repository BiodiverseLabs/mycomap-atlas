name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; nothing here needs to write to the repository, and a
# pull request from a fork must never reach a secret.
permissions:
  contents: read

jobs:
  guard:
    name: No data files
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Check the checker
        run: bash tools/check-no-data.sh --self-test
      - name: Check what this change adds
        run: bash tools/check-no-data.sh

  box:
    name: Server configuration
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # The deploy scripts' refusals, and Ubuntu 24.04's nginx serving the
      # site in front of a stand-in API (deploy/lightsail/test-box-config.sh).
      - name: Check the server's scripts, units and nginx site
        run: bash deploy/lightsail/test-box-config.sh

  r:
    name: R tests
    runs-on: ubuntu-latest
    # The same base as the release image (Dockerfile), so CI and releases
    # agree about R and GDAL.
    container: rocker/geospatial:4.6.1@sha256:e67737e30c66e6d2237570cd647e2bfec59315e533713473ab2ba391992bfa2c
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install test dependencies
        run: install2.r --error --skipinstalled digest jsonlite plumber testthat maxnet xgboost ranger blockCV curl
      - name: terra and every model package must be present
        # Without them the grid, layer and fitting tests skip, and the run
        # still goes green.
        run: |
          Rscript -e 'stopifnot(requireNamespace("terra", quietly = TRUE))'
          Rscript -e 'stopifnot(requireNamespace("maxnet", quietly = TRUE))'
          Rscript -e 'stopifnot(requireNamespace("xgboost", quietly = TRUE))'
          Rscript -e 'stopifnot(requireNamespace("ranger", quietly = TRUE))'
          Rscript -e 'stopifnot(requireNamespace("blockCV", quietly = TRUE))'
      - name: Tests, with no network and no credentials
        run: Rscript -e 'testthat::test_local()'

  image:
    name: Release image
    runs-on: ubuntu-latest
    # Only this job may write packages, and only its last step, which runs for
    # pushes to main, uses that: a pull request never publishes an image.
    permissions:
      contents: read
      packages: write
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # The build runs the whole test suite inside the image, so a green build
      # means the image that would compute a release passes its tests.
      - name: Build the image
        run: |
          docker build --build-arg ATLAS_COMMIT="$GITHUB_SHA" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t mycomap-atlas:ci .
      - name: The command line runs inside it
        run: docker run --rm mycomap-atlas:ci help
      - name: It runs as an ordinary user and records its commit
        run: |
          test "$(docker run --rm --entrypoint id mycomap-atlas:ci -u)" != "0"
          test "$(docker run --rm --entrypoint printenv mycomap-atlas:ci ATLAS_COMMIT)" = "$GITHUB_SHA"
      - name: It carries the built web app, and the nightly job's tools
        run: |
          docker run --rm --entrypoint test mycomap-atlas:ci -f /opt/atlas-web/index.html
          docker run --rm --entrypoint ssh mycomap-atlas:ci -V
          docker run --rm --entrypoint Rscript mycomap-atlas:ci -e 'stopifnot(requireNamespace("paws.compute", quietly = TRUE))'
      # EC2 workers pull the image of the orchestrator's own commit
      # (R/ec2.R), so every commit on main gets one, tagged with its full SHA.
      # No moving tag: a worker can only ever run a named commit.
      - name: Publish to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag mycomap-atlas:ci "$image"
          docker push "$image"
          docker logout ghcr.io

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # pnpm/action-setup v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.26.1
      # actions/setup-node v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Type-check and build
        working-directory: web
        run: pnpm build
