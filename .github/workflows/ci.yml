name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; nothing here needs to write to the repository, and a
# pull request from a fork must never reach a secret.
permissions:
  contents: read

jobs:
  guard:
    name: No data files
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Check the checker
        run: bash tools/check-no-data.sh --self-test
      - name: Check what this change adds
        run: bash tools/check-no-data.sh

  r:
    name: R tests
    runs-on: ubuntu-latest
    # The same image that builds releases, so CI and releases agree about GDAL.
    container: rocker/geospatial:latest
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install test dependencies
        run: install2.r --error --skipinstalled digest jsonlite plumber testthat maxnet
      - name: terra and maxnet must be present
        # Without them the grid, layer and fitting tests skip, and the run
        # still goes green.
        run: |
          Rscript -e 'stopifnot(requireNamespace("terra", quietly = TRUE))'
          Rscript -e 'stopifnot(requireNamespace("maxnet", quietly = TRUE))'
      - name: Tests, with no network and no credentials
        run: Rscript -e 'testthat::test_local()'

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # pnpm/action-setup v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.26.1
      # actions/setup-node v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Type-check and build
        working-directory: web
        run: pnpm build
