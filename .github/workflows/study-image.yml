name: study image

# An image for a study job (R/studyjob.R) of a commit that is not on main
# (Steve, 2026-11-20): a method branch is checked on EC2 before it may merge,
# and EC2 workers pull their image from GitHub Container Registry. The release
# image job (ci.yml) publishes main's commits only, so this one is run by hand,
# for one commit, from the Actions tab ("Run workflow"); GitHub lets only
# people with write access to the repository run it.
#
# It builds that commit exactly as the release image is built, which runs the
# whole test suite inside the image, makes the same checks, and pushes it as
#
#   ghcr.io/biodiverselabs/mycomap-atlas:study-<full sha>
#
# and nothing else: never latest, never a bare commit tag, which is what a
# production job's workers pull (R/ec2.R). A study job runs it only when told
# to: ATLAS_IMAGE=<that tag> for run-job-ec2.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "The full 40-character SHA of the commit to build"
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    name: Study image
    runs-on: ubuntu-latest
    if: github.repository == 'BiodiverseLabs/mycomap-atlas'
    permissions:
      contents: read
      packages: write
    env:
      COMMIT: ${{ inputs.commit }}
    steps:
      - name: The commit is a full SHA
        run: |
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit must be a full 40-character lowercase SHA" >&2
            exit 1
          fi
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.commit }}
      - name: It is that commit
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      # The build runs the whole test suite inside the image, as the release
      # image job's does.
      - name: Build the image
        run: |
          docker build --build-arg ATLAS_COMMIT="$COMMIT" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$COMMIT" \
            -t mycomap-atlas:study .
      - name: The command line runs inside it
        run: docker run --rm mycomap-atlas:study help
      - name: It runs as an ordinary user and records its commit
        run: |
          test "$(docker run --rm --entrypoint id mycomap-atlas:study -u)" != "0"
          test "$(docker run --rm --entrypoint printenv mycomap-atlas:study ATLAS_COMMIT)" = "$COMMIT"
      - name: It carries the nightly job's tools
        run: |
          docker run --rm --entrypoint ssh mycomap-atlas:study -V
          docker run --rm --entrypoint Rscript mycomap-atlas:study -e 'stopifnot(requireNamespace("paws.compute", quietly = TRUE))'
      - name: Publish as study-<sha>
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:study-$COMMIT"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag mycomap-atlas:study "$image"
          docker push "$image"
          docker logout ghcr.io
          echo "published $image"
